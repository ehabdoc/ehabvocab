services:
  - type: web
    name: ehabvocab
    runtime: python
    repo: https://github.com/ehabdoc/ehabvocab
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ehabvocab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: ehabvocab-db
    plan: free
    region: frankfurt
